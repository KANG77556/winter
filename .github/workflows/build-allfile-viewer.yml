name: Build ModuBogi APK

on:
  push:
    branches: ["allfile-viewer-apk"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
        working-directory: allfile-viewer

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ModuBogi-build-log
          path: allfile-viewer/build.log
          retention-days: 7

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ModuBogi-0.4.0-debug.apk
        working-directory: allfile-viewer

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModuBogi-APK
          path: allfile-viewer/ModuBogi-0.4.0-debug.apk
          retention-days: 30
