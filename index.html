<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>출석 인증</title>
  <!-- 카카오 SDK -->
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
</head>
<body style="text-align:center; margin-top:80px; font-family:system-ui;">
  <h2>방학 중 출석 인증</h2>
  <p>카카오톡 로그인을 완료하면 출석 폼으로 이동합니다.</p>
  <button onclick="kakaoLogin()" style="font-size:18px; padding:14px 18px;">
    카카오톡으로 출석하기
  </button>

  <script>
    // 🔑 ① 여기에 "JavaScript 키" 정확히 넣기
    //    (카카오 개발자 콘솔 > 앱 키 > JavaScript 키)
    Kakao.init("d15c7a7cc7ba04cf3cf77600d8256162");
    redirectUri: "https://kang77556.github.io/winter/",  //
    function kakaoLogin() {
      Kakao.Auth.login({
        scope: "profile_nickname",
        
        success: function () {
          Kakao.API.request({
            url: "/v2/user/me",
            success: function (res) {
              const nickname =
                (res && res.kakao_account &&
                 res.kakao_account.profile &&
                 res.kakao_account.profile.nickname) || "";

              // ✅ ② 구글폼 기본 주소 (이미 확정된 값)
              const formBase =
                "https://docs.google.com/forms/d/e/1FAIpQLSdCOqdWKL6r0160jsPTJcqQfg4bVyt7M4Y56L3uHJy7CVKqZA/viewform";

              // ✅ ③ 이름 질문 entry 번호 (이미 확정된 값)
              const nameEntry = "entry.354885157";

              // ✅ ④ 이름에 카카오 닉네임 자동 채워서 폼으로 이동
              const url =
                formBase +
                "?" +
                nameEntry +
                "=" +
                encodeURIComponent(nickname);

              window.location.href = url;
            },
            fail: function (err) {
              alert("사용자 정보 조회 실패: " + JSON.stringify(err));
            }
          });
        },
        fail: function (err) {
          alert("카카오 로그인 실패: " + JSON.stringify(err));
        }
      });
    }
  </script>
</body>
</html>
